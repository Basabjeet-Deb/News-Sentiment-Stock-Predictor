version: '3.8'

services:
  master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dist-master
    ports:
      - "8000:8000"
    environment:
      - NODE_TYPE=master
    volumes:
      - ./distributed_master.py:/app/distributed_master.py
    command: python distributed_master.py
    networks:
      - dist-network

  worker1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: dist-worker1
    environment:
      - MASTER_URL=http://master:8000
      - WORKER_ID=worker1
      - POLL_INTERVAL=2
    depends_on:
      - master
    networks:
      - dist-network

  worker2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: dist-worker2
    environment:
      - MASTER_URL=http://master:8000
      - WORKER_ID=worker2
      - POLL_INTERVAL=2
    depends_on:
      - master
    networks:
      - dist-network

  worker3:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: dist-worker3
    environment:
      - MASTER_URL=http://master:8000
      - WORKER_ID=worker3
      - POLL_INTERVAL=2
    depends_on:
      - master
    networks:
      - dist-network

networks:
  dist-network:
    driver: bridge
